<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="GenLayer animated loading spinner">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#FFB52E"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ring { transform-origin: 80px 80px; animation: spin 1.15s linear infinite; }
      .seg { transform-origin: 80px 80px; }
      .a { animation: pulse 1.15s ease-in-out infinite; }
      .b { animation: pulse 1.15s ease-in-out .19s infinite; }
      .c { animation: pulse 1.15s ease-in-out .38s infinite; }
      .d { animation: pulse 1.15s ease-in-out .57s infinite; }
      .e { animation: pulse 1.15s ease-in-out .76s infinite; }
      .f { animation: pulse 1.15s ease-in-out .95s infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%,100% { opacity:.22; transform:scale(.92); }
        35% { opacity:1; transform:scale(1.08); }
        60% { opacity:.48; transform:scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring,.a,.b,.c,.d,.e,.f { animation:none; }
      }
    </style>
  </defs>

  <!-- Subtle outer orbit -->
  <circle cx="80" cy="80" r="61" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity=".28"/>

  <!-- Six orbiting segments -->
  <g class="ring">
    <rect class="seg a" x="72" y="14" width="16" height="31" rx="8" fill="url(#glow)" filter="url(#softGlow)"/>
    <rect class="seg b" x="108" y="35" width="16" height="31" rx="8" transform="rotate(60 116 50.5)" fill="url(#glow)" filter="url(#softGlow)"/>
    <rect class="seg c" x="108" y="94" width="16" height="31" rx="8" transform="rotate(120 116 109.5)" fill="url(#glow)" filter="url(#softGlow)"/>
    <rect class="seg d" x="72" y="115" width="16" height="31" rx="8" transform="rotate(180 80 130.5)" fill="url(#glow)" filter="url(#softGlow)"/>
    <rect class="seg e" x="36" y="94" width="16" height="31" rx="8" transform="rotate(240 44 109.5)" fill="url(#glow)" filter="url(#softGlow)"/>
    <rect class="seg f" x="36" y="35" width="16" height="31" rx="8" transform="rotate(300 44 50.5)" fill="url(#glow)" filter="url(#softGlow)"/>
  </g>

  <!-- Minimal GenLayer-inspired center mark -->
  <g transform="translate(80 80)">
    <path d="M0-27 L25-13 L25 13 L0 27 L-25 13 L-25-13 Z" fill="#111318"/>
    <path d="M-3-17 L15-7 L15 1 L-3 11 L-12 6 L-12-2 L-3 3 L6-2 L-3-7 Z" fill="#FF7A00"/>
    <path d="M3 17 L-15 7 L-15-1 L3-11 L12-6 L12 2 L3-3 L-6 2 L3 7 Z" fill="#FF9A1F"/>
  </g>
</svg>
