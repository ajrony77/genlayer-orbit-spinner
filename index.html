<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenLayer Orbit Spinner</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #111318;
    }
    .card {
      width: min(92vw, 620px);
      padding: 48px;
      border-radius: 24px;
      text-align: center;
      background: white;
      box-shadow: 0 18px 60px rgba(0,0,0,.10);
    }
    img { width: 160px; height: 160px; }
    h1 { margin: 24px 0 8px; }
    p { margin: 0; opacity: .7; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0c0f; color: #f4f4f5; }
      .card { background: #15171b; box-shadow: 0 18px 60px rgba(0,0,0,.35); }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="genlayer_orbit_spinner.svg" alt="GenLayer animated loading spinner">
    <h1>GenLayer Orbit Spinner</h1>
    <p>Lightweight, scalable SVG loading animation.</p>
  </main>
</body>
</html>
